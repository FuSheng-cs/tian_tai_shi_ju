<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/pixel_city_20261104/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa">
    <script>
      if (location.pathname === '/') {
        const root = '/assets/images/pixel_city_20261104'
        const width = matchMedia('(max-width: 760px)').matches ? 960 : 1672
        for (const href of [`${root}/home-${width}.webp`]) {
          const link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        }
      }
    </script>
    <title>天台十句 - 网页文字冒险游戏</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
