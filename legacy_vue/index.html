<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b">
    <!-- home-title-preloads:start -->
    <script>
      if (location.pathname === '/') {
        const mobile = matchMedia('(max-width: 768px)').matches
        const title = mobile ? '/assets/images/home_title_20261001/title-600-4ee27ca46f08.webp' : '/assets/images/home_title_20261001/title-900-ec3116006d5a.webp'
        const background = `/assets/images/menu_home_bg_${mobile ? '900' : '1600'}.webp`
        for (const href of [title, background]) {
          const link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        }
      }
    </script>
    <!-- home-title-preloads:end -->
    <title>天台十句 - 网页文字冒险游戏</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
